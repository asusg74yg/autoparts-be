

networks:
  autocare-network:
    driver: bridge

services:
  autpart-be:
    container_name: autopart-be
    image: faizanraodev/autopart-be:latest
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - DATABASE_URL=postgres://postgres:ThisIsSecretPassword@postgres:5432/autoparts
      - POSTGRES_PASSWORD=ThisIsSecretPassword
      - DEFAULT_ROLE=USER
      - JWT_SECRET=autoPartsSecret123#$
      - JWT_REFRESH_SECRET=autoPartsSecret456#$
      - RABBIT_MQ=rabbitmq:5672
      - STRIPE_SECRET_KEY=sk_test_51S0bU076qmv7PlKpselwtDB5FzsmFKjuswdysiAv1thobKsf0Eg9DV4qxNGgHcWT60wdtYgahONIxHWcEdvBBGd900JCUUqmlZ
      - POSTGRES_HOST=postgres
      - STRIPE_SUCCESS_URL=http://localhost:4000/success?session_id={CHECKOUT_SESSION_ID}
      - STRIPE_RETURN_URL=http://localhost:3000/

      - SENDGRID_API_KEY=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
      - EMAIL_SERVICE_FROM=rmfbusiness1920@gmail.com

      - BASE_PATH_FOR_VCDB=autocare.org/AutoCare_VCdb_NA_LDPS_enUS_JSON_20250828
      - BASE_PATH_FOR_PCDB=autocare.org/AutoCare_PCdb_enUS_JSON_20250828
      - BASE_PATH_FOR_BRAND=autocare.org/
      - CC_EMAIL=admin@gmail.com

    restart: unless-stopped
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - autocare-network
   
    working_dir: /usr/src/app
  postgres:
    image: postgres
    container_name: postgres_db
    
    ports:
      - "5430:5432"
    environment:
      # - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PASSWORD=ThisIsSecretPassword
    volumes:
      - ./postgres-data:/var/lib/postgresql/data/
    working_dir: /var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - autocare-network
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    restart: unless-stopped
    networks:
      - autocare-network
volumes:
  my-postgres-data:
